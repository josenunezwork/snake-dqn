<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="900" height="360" rx="14" fill="#0b0f17"/>
  <text x="28" y="40" fill="#e6edf6" font-size="20" font-weight="700">snake-dqn</text>
  <text x="132" y="40" fill="#8a97a8" font-size="15">distributed Apex DQN · train → gate → serve</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6675"/></marker>
  </defs>

  <rect x="28" y="74" width="300" height="170" rx="10" fill="#0f1622" stroke="#263041"/>
  <text x="44" y="98" fill="#38bdf8" font-size="13" font-weight="700">DISTRIBUTED APEX TRAINING</text>

  <rect x="44" y="112" width="120" height="50" rx="8" fill="#11283a" stroke="#1d6f96"/>
  <text x="104" y="133" fill="#cdeafe" font-size="13" font-weight="700" text-anchor="middle">N actors</text>
  <text x="104" y="150" fill="#8aa6bd" font-size="11" text-anchor="middle">CPU · varied ε</text>

  <rect x="192" y="112" width="120" height="50" rx="8" fill="#0e2a26" stroke="#1f7a6b"/>
  <text x="252" y="133" fill="#bdeee6" font-size="13" font-weight="700" text-anchor="middle">SumTree PER</text>
  <text x="252" y="150" fill="#8fb8b0" font-size="11" text-anchor="middle">O(log N) · n-step</text>

  <rect x="118" y="180" width="120" height="50" rx="8" fill="#10261a" stroke="#1f7a4d"/>
  <text x="178" y="201" fill="#c2efd5" font-size="13" font-weight="700" text-anchor="middle">GPU learner</text>
  <text x="178" y="218" fill="#8fbfa3" font-size="11" text-anchor="middle">Double · Dueling</text>

  <line x1="164" y1="137" x2="190" y2="137" stroke="#5b6675" stroke-width="2" marker-end="url(#a)"/>
  <line x1="252" y1="162" x2="200" y2="180" stroke="#5b6675" stroke-width="2" marker-end="url(#a)"/>
  <line x1="160" y1="180" x2="120" y2="162" stroke="#5b6675" stroke-width="2" marker-end="url(#a)"/>
  <text x="178" y="246" fill="#5b6675" font-size="10" text-anchor="middle">weights broadcast back to actors</text>

  <rect x="360" y="120" width="150" height="78" rx="10" fill="#141a24" stroke="#263041"/>
  <text x="435" y="146" fill="#e6edf6" font-size="13" font-weight="700" text-anchor="middle">Champion</text>
  <text x="435" y="166" fill="#8a97a8" font-size="11" text-anchor="middle">feedforward ApexNet</text>
  <text x="435" y="183" fill="#38bdf8" font-size="11" text-anchor="middle">61-D free-space</text>

  <rect x="542" y="120" width="150" height="78" rx="10" fill="#141a24" stroke="#263041"/>
  <text x="617" y="146" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">Promotion gate</text>
  <text x="617" y="166" fill="#8a97a8" font-size="11" text-anchor="middle">frozen opponents</text>
  <text x="617" y="183" fill="#8a97a8" font-size="11" text-anchor="middle">paired seeds · 95% CI</text>

  <rect x="724" y="120" width="150" height="78" rx="10" fill="#141a24" stroke="#263041"/>
  <text x="799" y="146" fill="#e6edf6" font-size="13" font-weight="700" text-anchor="middle">Web app</text>
  <text x="799" y="166" fill="#8a97a8" font-size="11" text-anchor="middle">FastAPI + React</text>
  <text x="799" y="183" fill="#34d399" font-size="11" text-anchor="middle">live · WebSocket</text>

  <line x1="328" y1="159" x2="358" y2="159" stroke="#5b6675" stroke-width="2" marker-end="url(#a)"/>
  <line x1="510" y1="159" x2="540" y2="159" stroke="#5b6675" stroke-width="2" marker-end="url(#a)"/>
  <line x1="692" y1="159" x2="722" y2="159" stroke="#5b6675" stroke-width="2" marker-end="url(#a)"/>

  <text x="28" y="288" fill="#8a97a8" font-size="12" font-weight="700">THE INSIGHT</text>
  <text x="28" y="310" fill="#e6edf6" font-size="13">Self-collision was an observation blind-spot, not a reward bug. Three BFS "free-space"</text>
  <text x="28" y="328" fill="#e6edf6" font-size="13">features let the snake hold mass without trapping itself — verified on the frozen-opponent gate</text>
  <text x="28" y="346" fill="#34d399" font-size="13" font-weight="700">mean mass 139.5 vs 41.4 · 8/8 paired-seed wins · CI-separated</text>
</svg>
