# Pre-commit hooks. Install once: `./venv/bin/pre-commit install`
# Uses the locally-installed tools (from requirements-dev.txt) so pre-commit,
# CI, and your editor all run the exact same versions — no formatter drift.
repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: isort --profile black
        language: system
        types: [python]
      - id: black
        name: black
        entry: black --line-length 100
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
