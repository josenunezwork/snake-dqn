# Explicit Watch/Play promotion evaluation target.  This remains separate from
# mechanics_v2 training configuration: runtime evaluation does not learn, keeps
# opponents respawning, and terminates the scored hero through its profile.
network:
  input_size: 61
  hidden_size: 512
  output_size: 6
  use_free_space: true
rewards:
  version: 2
  death: -11.0
  food_base: 3.0
  survival: 0.01
  death_length_scale: 0.0
  boost_segment: 3.0
  reward_max: 5.0
  reward_min: -12.0
  kill_max: 5.0
game:
  mechanics_version: 2
  width: 1450
  height: 830
  num_snakes: 6
  initial_food: 250
  max_food: 300
  max_frames: 5000
  frame_rate: 1
  max_length: 150
training:
  gamma: 0.99
