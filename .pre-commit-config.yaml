# Pre-commit hooks. Install once: `./venv/bin/python -m pre_commit install`
# Uses the locally-installed tools (from requirements-dev.txt) so pre-commit,
# CI, and your editor all run the exact same versions — no formatter drift.
#
# Immutable research/evidence trees and SHA-256-pinned modules/tests are
# excluded so formatting hooks can never rewrite hash-bound files.
exclude: ^(research/|docs/research/|docs/experiments/|tests/fixtures/|saved_snakes/|src/evaluation/safety_veto.*\.py$|src/evaluation/strict_promotion\.py$|src/scripts/tournament_eval\.py$|tests/__init__\.py$|tests/test_relative_actions\.py$|tests/test_s18_kl_contrast_audit_outer_v1\.py$|tests/test_s18_kl_contrast_outer_v1\.py$|tests/test_v8_admission_evidence\.py$|tools/ops/.*\.md$|tools/small_bench_evidence_20261024/)

repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: ./venv/bin/python -m isort --profile black
        language: system
        types: [python]
        files: ^(src/|web/backend/)
      - id: black
        name: black
        entry: ./venv/bin/python -m black --line-length 100
        language: system
        types: [python]
        files: ^(src/|web/backend/)
      - id: flake8
        name: flake8
        entry: ./venv/bin/python -m flake8
        language: system
        types: [python]
        files: ^(src/|web/backend/|web/serve\.py$|conftest\.py$|scripts/|tools/ops/|tests/)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(src/|web/backend/)
      - id: end-of-file-fixer
        files: ^(src/|web/backend/)
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
