[pytest]
minversion = 7.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --showlocals
    -v
; --strict-markers/--strict-config in addopts are inert: the flags only append to
; override_ini, which is resolved before addopts is merged. The ini keys are the
; enforcement point (_pytest/mark/structures.py reads getini("strict_markers")).
strict_markers = true
strict_config = true
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_gpu: marks tests that require GPU
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

