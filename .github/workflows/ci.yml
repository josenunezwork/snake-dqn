name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: lint + tests
    # Historical numerical plans are byte-pinned on Darwin/ARM64 (STATUS: Mac authority).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system test dependencies
        run: command -v rg || brew install ripgrep
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (black, isort, flake8)
        run: |
          black --check --line-length 100 src web/backend
          isort --profile black --check-only src web/backend
          flake8 src web/backend
      - name: Verify pinned numerical plans
        run: |
          python -c "import platform; print(platform.platform(), platform.machine())"
          pytest -q tests/test_sequential_gate.py tests/test_m3_rule_spec.py tests/test_m3c_rule_spec.py tests/test_m4_rule_spec.py
      - name: Run tests
        run: pytest -q -m "not slow"

  frontend:
    name: frontend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install
        working-directory: web/frontend
        run: npm ci
      - name: Unit tests (vitest)
        working-directory: web/frontend
        run: npm test
      - name: Build
        working-directory: web/frontend
        run: npm run build
