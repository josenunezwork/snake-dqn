# Production training config for the 61-D free-space WINNER (champion_a5).
#
# Continues the proven benchmark champion (saved_snakes/champion_a5_freespace_20260621.pth,
# mean_mass 139.5 vs 41.4 on the frozen paired-seed benchmark). The winning ingredient is
# the 61-D free-space STATE FEATURE ("don't trap yourself"), NOT the reward — champion_a5
# was actually trained with the high-food reward below and still held mass, because
# free-space stops it self-trapping when long.
#
# Reward + dims below MATCH champion_a5's checkpoint contract EXACTLY so a training-mode
# --resume passes the contract (it validates gamma, reward_death, reward_food_base):
#   input 61, hidden 512, use_free_space true, gamma 0.99, n_step 3,
#   death -11, food_base 3.0, survival 0.01, death_length_scale 0.0, boost_segment 3.0.
network:
  input_size: 61
  hidden_size: 512
  output_size: 6
  use_free_space: true
rewards:
  death: -11.0
  food_base: 3.0
  survival: 0.01
  death_length_scale: 0.0
  boost_segment: 3.0
  reward_max: 5.0
  reward_min: -12.0
  kill_max: 5.0
game:
  width: 1450
  height: 830
  num_snakes: 6
  initial_food: 250
  max_food: 300
  max_frames: 5000
  frame_rate: 1
  max_length: 150
training:
  batch_size: 256
  learning_rate: 0.0001
  gamma: 0.99
  target_update_frequency: 2500
  train_frequency: 4
  checkpoint_frequency: 5000
  save_interval: 5000
apex:
  batch_size: 256
  buffer_size: 200000
  min_buffer_size: 10000
  target_update_freq: 2500
  learning_rate: 0.0001
  gamma: 0.99
  n_step: 3
  use_compile: false
  pin_memory: false
